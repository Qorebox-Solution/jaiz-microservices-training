map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  absolute_redirect off;   # keep :3000 in redirects

  location = /code { return 302 /code/$is_args$args; }

  # Step-by-step guide (static files)
  location / {
    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control "no-cache";
  }

  # Browser VS Code (code-server), same origin so it can be embedded
  location /code/ {
    proxy_pass http://ide:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Accept-Encoding gzip;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
  }
}
